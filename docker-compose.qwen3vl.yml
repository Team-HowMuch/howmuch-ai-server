# 실험용: VLM 을 Qwen3-VL 로 바꿔 본다. 기본 구성(docker-compose.yml)은 그대로 둔다.
#
#   docker compose -f docker-compose.yml -f docker-compose.qwen3vl.yml pull vllm
#   docker compose -f docker-compose.yml -f docker-compose.qwen3vl.yml up -d
#   docker compose logs -f vllm     # 모델 내려받기(약 17GB)가 끝나고 서버가 뜰 때까지
#
# 모델 바꾸기(기본은 bf16 8B. 메모리가 모자라면 아래 중 하나):
#   QWEN3VL_MODEL=Qwen/Qwen3-VL-8B-Instruct-FP8 docker compose -f ... up -d
#   QWEN3VL_MODEL=Qwen/Qwen3-VL-4B-Instruct     docker compose -f ... up -d
#
# 되돌리기: docker compose up -d   (override 없이. 기존 Qwen2.5-VL 로 돌아간다)
#
# Qwen3-VL 은 vLLM 0.11 이상이 필요하다. 이미지가 오래됐으면 pull 로 최신을 받는다.
services:
  vllm:
    command: >
      --model ${QWEN3VL_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --max-num-seqs 2
      --limit-mm-per-prompt '{"image": 1, "video": 0}'
  api:
    environment:
      VLM_MODEL: ${QWEN3VL_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
