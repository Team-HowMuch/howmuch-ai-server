services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --max-model-len 8192
      --gpu-memory-utilization 0.85
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s

  api:
    build: .
    ports:
      - "8600:8600"
    environment:
      VLM_BACKEND: openai
      VLM_API_BASE: http://vllm:8000/v1
      VLM_MODEL: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      AMPLITUDE_AI_API_KEY: ${AMPLITUDE_AI_API_KEY}
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
